[package]
name = "sodmin"
version = "0.1.0"
authors = ["Contrix Authors"]
license = "AGPL-3.0-or-later"
edition = "2024"

[dependencies]
coauth-admin-types = { path = "../coauth/crates/admin-types" }
# Global report #10 — sodmin previously hand-copied every protocol type.
# Depend on the SDK core + identifiers crates (default features off so the
# wasm bundle stays lean — the `client` / `keystore-*` / `salvo` / `mls`
# features pull native-only deps and are deliberately NOT enabled here).
contrix-core = { path = "../contrix-rust-sdk/crates/core", default-features = false }
contrix-identifiers = { path = "../contrix-rust-sdk/crates/identifiers", default-features = false }
dioxus = { version = "0.7.9", features = ["web", "router"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
gloo-net = { version = "0.7", features = ["http", "json"] }
gloo-storage = "0.4.0"
gloo-timers = { version = "0.4", features = ["futures"] }
web-sys = { version = "0.3.95", features = [
    "Window",
    "Document",
    "HtmlDocument",
    "HtmlElement",
    "HtmlAnchorElement",
    "Location",
    "Storage",
    "MediaQueryList",
    "Url",
    "UrlSearchParams",
    "Headers",
    "RequestInit",
    "Request",
    "Response",
    "RequestCredentials",
    "RequestMode",
    "DomTokenList",
    "Element",
    "EventTarget",
    "Navigator",
    "Clipboard",
    "Blob",
    "BlobPropertyBag",
    "Crypto",
    "StorageEvent",
    "SubtleCrypto",
] }
wasm-bindgen = "0.2.118"
wasm-bindgen-futures = "0.4.68"
js-sys = "0.3.95"
chrono = { version = "0.4.44", features = ["serde", "wasmbind"] }
urlencoding = "2.1.3"
base64 = { version = "0.22", default-features = false, features = ["alloc"] }
log = "0.4.29"
dioxus-logger = "0.7.9"
regex-lite = "0.1.9"

[build-dependencies]
serde_json = "1.0.149"

# Native-only deps used by the `sodmin-smoke` post-deploy smoke test
# binary (src/bin/sodmin_smoke.rs). Gated on cfg(not(target_arch="wasm32"))
# so they don't bloat the wasm bundle.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }

[[bin]]
name = "sodmin"
path = "src/main.rs"

[[bin]]
name = "sodmin-smoke"
path = "src/bin/sodmin_smoke.rs"
