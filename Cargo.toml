[package]
name = "sodmin"
version = "0.3.0"
authors = ["Cokret Authors"]
license = "AGPL-3.0-or-later"
edition = "2024"

[dependencies]
# Global report #10 — sodmin previously hand-copied every protocol type.
# Depend on the SDK core + identifiers crates (default features off so the
# wasm bundle stays lean — the `client` / `keystore-*` / `salvo` / `mls`
# features pull native-only deps and are deliberately NOT enabled here).
base64 = {workspace = true,default-features = false,features = ["alloc"]}
chrono = {workspace = true,features = ["serde", "wasmbind"]}
coauth-admin-types = {workspace = true}
cokret-contracts = {workspace = true,default-features = false}
cokret-core = {workspace = true,default-features = false}
cokret-identifiers = {workspace = true,default-features = false}
dioxus = {workspace = true,features = ["web", "router"]}
dioxus-logger = {workspace = true}
gloo-net = {workspace = true,features = ["http", "json"]}
gloo-storage = {workspace = true}
gloo-timers = {workspace = true,features = ["futures"]}
js-sys = {workspace = true}
log = {workspace = true}
regex-lite = {workspace = true}
serde = {workspace = true,features = ["derive"]}
serde_json = {workspace = true}
urlencoding = {workspace = true}
wasm-bindgen = {workspace = true}
wasm-bindgen-futures = {workspace = true}
web-sys = {workspace = true,features = [
    "Window",
    "Document",
    "HtmlDocument",
    "HtmlElement",
    "HtmlAnchorElement",
    "Location",
    "Storage",
    "MediaQueryList",
    "Url",
    "UrlSearchParams",
    "Headers",
    "RequestInit",
    "Request",
    "Response",
    "RequestCredentials",
    "RequestMode",
    "DomTokenList",
    "Element",
    "EventTarget",
    "Navigator",
    "Clipboard",
    "Blob",
    "BlobPropertyBag",
    "Crypto",
    "StorageEvent",
    "SubtleCrypto",
]}

[build-dependencies]

# Native-only deps used by the `sodmin-smoke` post-deploy smoke test
# binary (src/bin/sodmin_smoke.rs). Gated on cfg(not(target_arch="wasm32"))
# so they don't bloat the wasm bundle.
serde_json = {workspace = true}
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
reqwest = {workspace = true,default-features = false,features = ["blocking", "json", "rustls"]}

[[bin]]
name = "sodmin"
path = "src/main.rs"

[[bin]]
name = "sodmin-smoke"
path = "src/bin/sodmin_smoke.rs"

[workspace]
resolver = "3"

[workspace.dependencies]
base64 = {version = "0.22",default-features = false}
chrono = "0.4.45"
coauth-admin-types = {path = "../coauth/crates/admin-types"}
cokret-contracts = {path = "../cokret-rust-sdk/crates/contracts",default-features = false}
cokret-core = {path = "../cokret-rust-sdk/crates/core",default-features = false}
cokret-identifiers = {path = "../cokret-rust-sdk/crates/identifiers",default-features = false}
dioxus = "0.7.9"
dioxus-logger = "0.7.9"
gloo-net = "0.7"
gloo-storage = "0.4.0"
gloo-timers = "0.4"
js-sys = "0.3.100"
log = "0.4.32"
regex-lite = "0.1.9"
reqwest = {version = "0.13",default-features = false}
serde = "1.0.228"
serde_json = "1.0.150"
urlencoding = "2.1.3"
wasm-bindgen = "0.2.123"
wasm-bindgen-futures = "0.4.73"
web-sys = "0.3.100"
