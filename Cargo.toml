[package]
name = "sodmin"
version = "0.3.0"
authors = ["Cokret Authors"]
license = "AGPL-3.0-or-later"
edition = "2024"

[dependencies]
# Global report #10 — sodmin previously hand-copied every protocol type.
# Depend on the SDK core + identifiers crates (default features off so the
# wasm bundle stays lean — the `client` / `keystore-*` / `salvo` / `mls`
# features pull native-only deps and are deliberately NOT enabled here).
base64 = {workspace = true,default-features = false,features = ["alloc"]}
chrono = {workspace = true,features = ["serde", "wasmbind"]}
coauth-admin-types = {workspace = true}
cokret-core = {workspace = true,default-features = false}
cokret-identifiers = {workspace = true,default-features = false}
dioxus = {workspace = true,features = ["web", "router"]}
dioxus-logger = {workspace = true}
futures-util = {workspace = true,default-features = false,features = ["alloc"]}
gloo-net = {workspace = true,features = ["http", "json"]}
gloo-storage = {workspace = true}
gloo-timers = {workspace = true,features = ["futures"]}
js-sys = {workspace = true}
log = {workspace = true}
regex-lite = {workspace = true}
serde = {workspace = true,features = ["derive"]}
serde_json = {workspace = true}
soland-core = {workspace = true}
urlencoding = {workspace = true}
yoface = {workspace = true}
wasm-bindgen = {workspace = true}
wasm-bindgen-futures = {workspace = true}
web-sys = {workspace = true,features = [
    "Window",
    "Document",
    "HtmlDocument",
    "HtmlElement",
    "HtmlAnchorElement",
    "Location",
    "Storage",
    "MediaQueryList",
    "Url",
    "UrlSearchParams",
    "Headers",
    "RequestInit",
    "Request",
    "Response",
    "RequestCredentials",
    "RequestMode",
    "DomTokenList",
    "Element",
    "EventTarget",
    "Navigator",
    "Clipboard",
    "Blob",
    "BlobPropertyBag",
    "Crypto",
    "StorageEvent",
    "SubtleCrypto",
]}

[build-dependencies]

# Native-only deps used by the `sodmin-smoke` post-deploy smoke test
# binary (src/bin/sodmin_smoke.rs). Gated on cfg(not(target_arch="wasm32"))
# so they don't bloat the wasm bundle.
serde_json = {workspace = true}
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
reqwest = {workspace = true,default-features = false,features = ["blocking", "json", "rustls"]}

[[bin]]
name = "sodmin"
path = "src/main.rs"

[[bin]]
name = "sodmin-smoke"
path = "src/bin/sodmin_smoke.rs"

# cokret fork of DioxusLabs/dioxus, branched off the v0.7.9 tag (same patch
# set as yougen — keep the two in lockstep). The only delta is
# `Callback::__point_to` in `packages/core/src/events.rs`: upstream 0.7.9
# calls `.unwrap()` on `point_to`, which aborts the entire wasm instance
# (white screen) when an `Option<EventHandler>` prop's owner scope is
# reclaimed in the same frame the rsx diff tries to re-point its stable
# handle — surfacing as `Result::unwrap() on Dropped(ValueDroppedError)`.
# The fork degrades that unwrap to a trace-log no-op.
#
# The wasm-shared lifetime crates below MUST come from the same git source as
# `dioxus-core`: a git `dioxus-core` pulls in git `generational-box` /
# `subsecond` via workspace deps, and if the registry copies remained, the
# same crate would exist under two sources and `GenerationalBox<T>` would
# mismatch across the registry `dioxus-signals`/`dioxus-web` and the patched
# core.
# See https://github.com/cokret/dioxus/commit/e59f9f24a5c27c9303cd61edd0452b44161374ab
# rev 钉死,升级时手工 bump。
#
# ⚠️ yoface 依赖 dioxus-primitives(components fork)。`[patch]` 段不被依赖继承
# (仅对 workspace 根生效),故 sodmin 作为 workspace 根必须照抄 yoface README
# §2 的 components patch 段,rev 与 core patch 同源钉死,否则 GenerationalBox<T>
# 会因 dioxus-primitives 跨源(registry vs cokret fork)而 mismatch。
[patch."https://github.com/DioxusLabs/components"]
dioxus-primitives = { git = "https://github.com/cokret/dioxus-components", rev = "3510aeee2d14f0ca2c11682c9b826650cb557d2f" }

[patch.crates-io]
dioxus-core       = { git = "https://github.com/cokret/dioxus", rev = "e59f9f24a5c27c9303cd61edd0452b44161374ab" }
dioxus-core-types = { git = "https://github.com/cokret/dioxus", rev = "e59f9f24a5c27c9303cd61edd0452b44161374ab" }
generational-box  = { git = "https://github.com/cokret/dioxus", rev = "e59f9f24a5c27c9303cd61edd0452b44161374ab" }
subsecond         = { git = "https://github.com/cokret/dioxus", rev = "e59f9f24a5c27c9303cd61edd0452b44161374ab" }
subsecond-types   = { git = "https://github.com/cokret/dioxus", rev = "e59f9f24a5c27c9303cd61edd0452b44161374ab" }

[workspace]
resolver = "3"

[workspace.dependencies]
base64 = {version = "0.22",default-features = false}
chrono = "0.4.45"
coauth-admin-types = {path = "../coauth/crates/admin-types"}
cokret-core = {path = "../cokret-rust-sdk/crates/core",default-features = false}
cokret-identifiers = {path = "../cokret-rust-sdk/crates/identifiers",default-features = false}
dioxus = "0.7.9"
dioxus-logger = "0.7.9"
futures-util = {version = "0.3.32",default-features = false}
gloo-net = "0.7"
gloo-storage = "0.4.0"
gloo-timers = "0.4"
js-sys = "0.3.100"
log = "0.4.32"
regex-lite = "0.1.9"
reqwest = {version = "0.13",default-features = false}
serde = "1.0.228"
serde_json = "1.0.150"
soland-core = {path = "../soland/crates/core"}
urlencoding = "2.1.3"
wasm-bindgen = "0.2.123"
wasm-bindgen-futures = "0.4.73"
web-sys = "0.3.100"
yoface = {path = "../yoface"}
