name: a11y

on:
  pull_request:
    paths:
      - "src/**"
      - "scripts/a11y/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/a11y.yml"
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  axe:
    name: axe-core SPA scan
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install JS deps
        run: npm ci

      - name: Install Rust + wasm target
        uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88 # master
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown

      - name: Install dioxus-cli
        run: cargo install dioxus-cli --locked --version "0.7.*"

      - name: Build SPA
        run: dx build --release

      - name: Install Playwright
        run: npx playwright install --with-deps chromium

      - name: Run axe-core scan
        run: |
          # Two-step scan harness:
          # 1. Serve the built SPA on http://127.0.0.1:4173 (any static
          #    server is fine; the local helper falls back to index.html
          #    for client-side routes).
          # 2. Walk a representative set of admin pages through Playwright
          #    + @axe-core/playwright and fail on any "serious" or
          #    "critical" violation.
          node scripts/serve-spa.mjs dist 4173 &
          SPA_PID=$!
          trap "kill $SPA_PID" EXIT
          sleep 2
          node ./scripts/a11y/axe-scan.mjs http://127.0.0.1:4173
