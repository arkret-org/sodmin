name: Local bundle

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  attestations: write
  artifact-metadata: write

concurrency:
  group: local-bundle-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUSTFLAGS: "-D warnings"

jobs:
  build:
    name: Build WASM artifact
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          submodules: recursive

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88 # master
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown

      - name: Install binaryen
        run: |
          sudo apt-get update
          sudo apt-get install -y binaryen

      - name: Cache cargo registry, git, and target
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          shared-key: wasm

      - name: Install dioxus-cli
        run: cargo install dioxus-cli@0.7.9 --locked

      - name: dx build --release
        run: dx build --release

      - name: Locate build artifact
        id: artifact
        run: |
          set -euo pipefail
          dist_dir="$(find target/dx -type d -path '*/release/web/public' | head -n 1)"
          test -n "$dist_dir"
          test -f "$dist_dir/index.html"
          echo "dir=$dist_dir" >> "$GITHUB_OUTPUT"
          ref_name="${GITHUB_REF_NAME:-local}"
          archive="sodmin-${ref_name}-web-public.tar.gz"
          tar -czf "$archive" -C "$dist_dir" .
          echo "archive=$archive" >> "$GITHUB_OUTPUT"

      - name: Compute sha256
        run: |
          set -euo pipefail
          sha256sum "${{ steps.artifact.outputs.archive }}" > "${{ steps.artifact.outputs.archive }}.sha256"

      - name: Install CycloneDX generator
        run: cargo install cargo-cyclonedx@0.5.9 --locked

      - name: Generate Rust and npm SBOMs
        run: |
          set -euo pipefail
          cargo cyclonedx --format json --all --override-filename sodmin-rust.cdx
          npm sbom --sbom-format cyclonedx > sodmin-npm.cdx.json

      - name: Attest bundle build provenance
        if: github.event_name != 'pull_request'
        uses: actions/attest@f6bf1532d7d6793fce74eac584813a8eee607999 # v4
        with:
          subject-path: ${{ steps.artifact.outputs.archive }}

      - name: Attest Rust SBOM
        if: github.event_name != 'pull_request'
        uses: actions/attest@f6bf1532d7d6793fce74eac584813a8eee607999 # v4
        with:
          subject-path: ${{ steps.artifact.outputs.archive }}
          sbom-path: sodmin-rust.cdx.json

      - name: Attest npm SBOM
        if: github.event_name != 'pull_request'
        uses: actions/attest@f6bf1532d7d6793fce74eac584813a8eee607999 # v4
        with:
          subject-path: ${{ steps.artifact.outputs.archive }}
          sbom-path: sodmin-npm.cdx.json

      - name: Generate local cosign evidence
        run: bash scripts/local-cosign-evidence.sh "${{ steps.artifact.outputs.archive }}" cosign-evidence

      - name: Upload local bundle artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sodmin-web-public
          path: |
            ${{ steps.artifact.outputs.archive }}
            ${{ steps.artifact.outputs.archive }}.sha256
            sodmin-rust.cdx.json
            sodmin-npm.cdx.json
            cosign-evidence/
