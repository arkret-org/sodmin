name: Docker

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out sodmin
        uses: actions/checkout@v4
        with:
          path: sodmin

      # The sodmin Dockerfile uses an umbrella build context (parent of
      # sodmin/) so cargo path-deps `../contrix-rust-sdk/...` and
      # `../coauth/crates/admin-types` resolve in the build sandbox.
      # Pin to `main` so single-repo image builds match nightly stack.
      - name: Check out coauth
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/coauth
          path: coauth
          ref: main

      - name: Check out contrix-rust-sdk
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/contrix-rust-sdk
          path: contrix-rust-sdk
          ref: main

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=ref,event=tag
            type=sha,format=short,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          # Umbrella context (parent of sodmin/) so the Dockerfile's
          # `COPY contrix-rust-sdk/`, `COPY coauth/`, `COPY sodmin/`
          # all resolve against sibling checkouts.
          context: .
          file: ./sodmin/Dockerfile
          platforms: linux/amd64,linux/arm64
          pull: true
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max,ignore-error=true
