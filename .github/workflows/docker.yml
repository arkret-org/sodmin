name: Docker

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out sodmin
        uses: actions/checkout@v4
        with:
          path: sodmin

      # The sodmin Dockerfile uses an umbrella build context (parent of
      # sodmin/) so cargo path-deps `../cokret-rust-sdk/...` and
      # `../coauth/crates/admin-types` resolve in the build sandbox.
      # Pin to `main` so single-repo image builds match nightly stack.
      - name: Check out coauth
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/coauth
          path: coauth
          ref: main
          token: ${{ secrets.CI_REPO_TOKEN || github.token }}

      - name: Check out cokret-rust-sdk
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/cokret-rust-sdk
          path: cokret-rust-sdk
          ref: main
          token: ${{ secrets.CI_REPO_TOKEN || github.token }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image locally
        uses: docker/build-push-action@v6
        with:
          # Umbrella context (parent of sodmin/) so the Dockerfile's
          # `COPY cokret-rust-sdk/`, `COPY coauth/`, `COPY sodmin/`
          # all resolve against sibling checkouts.
          context: .
          file: ./sodmin/Dockerfile
          platforms: linux/amd64,linux/arm64
          pull: true
          push: false
          tags: sodmin:local
          cache-from: type=gha
          cache-to: type=gha,mode=max,ignore-error=true

      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@0.33.1
        with:
          scan-type: fs
          scan-ref: ./sodmin
          format: table
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true
