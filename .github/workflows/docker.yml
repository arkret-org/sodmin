name: Docker

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out sodmin
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          path: sodmin

      # The sodmin Dockerfile uses an umbrella build context (parent of
      # sodmin/) so cargo path-deps `../arkret-rust-sdk/...` and
      # `../coauth/crates/admin-types` resolve in the build sandbox.
      # Pin to `main` so single-repo image builds match nightly stack.
      - name: Check out coauth
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          repository: ${{ github.repository_owner }}/coauth
          path: coauth
          ref: main
          token: ${{ secrets.CI_REPO_TOKEN || github.token }}

      - name: Check out arkret-rust-sdk
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          repository: ${{ github.repository_owner }}/arkret-rust-sdk
          path: arkret-rust-sdk
          ref: main
          token: ${{ secrets.CI_REPO_TOKEN || github.token }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build Docker image locally
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          # Umbrella context (parent of sodmin/) so the Dockerfile's
          # `COPY arkret-rust-sdk/`, `COPY coauth/`, `COPY sodmin/`
          # all resolve against sibling checkouts.
          context: .
          file: ./sodmin/Dockerfile
          platforms: linux/amd64,linux/arm64
          pull: true
          push: false
          tags: sodmin:local
          cache-from: type=gha
          cache-to: type=gha,mode=max,ignore-error=true

      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@b6643a29fecd7f34b3597bc6acb0a98b03d33ff8 # v0.33.1
        with:
          scan-type: fs
          scan-ref: ./sodmin
          format: table
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true
