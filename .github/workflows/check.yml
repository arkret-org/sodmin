name: Check

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUSTFLAGS: "-D warnings"

jobs:
  rust:
    name: cargo check + test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown

      - name: Cache cargo registry, git, and target
        uses: Swatinem/rust-cache@v2

      - name: cargo fmt (host)
        run: cargo fmt --all -- --check

      - name: cargo check (host)
        run: cargo check --workspace --all-targets --locked

      - name: cargo test (host)
        run: cargo test --workspace --locked --no-fail-fast

      - name: cargo clippy (host)
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

  wasm-build:
    name: dx build (release)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install binaryen
        run: |
          sudo apt-get update
          sudo apt-get install -y binaryen

      - name: Cache cargo registry, git, and target
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: wasm

      - name: Install dioxus-cli
        run: cargo install dioxus-cli@0.7.5 --locked

      - name: dx build --release
        run: dx build --release

      - name: Locate build artifact
        id: dist
        run: |
          set -euo pipefail
          dist_dir="$(find target/dx -type d -path '*/release/web/public' | head -n 1)"
          test -n "$dist_dir"
          test -f "$dist_dir/index.html"
          echo "build artifact at: $dist_dir"
          echo "dir=$dist_dir" >> "$GITHUB_OUTPUT"

      - name: Upload web artifact
        uses: actions/upload-artifact@v4
        with:
          name: sodmin-web-public
          path: ${{ steps.dist.outputs.dir }}

  e2e:
    name: Playwright (smoke)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: wasm-build
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install npm deps
        run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: Download web artifact
        uses: actions/download-artifact@v4
        with:
          name: sodmin-web-public
          path: dist
      - name: Start static SPA
        run: |
          node scripts/serve-spa.mjs dist 4173 > serve.log 2>&1 &
          echo $! > serve.pid
          sleep 2
      - name: Run Playwright smoke
        env:
          SODMIN_E2E_BASE_URL: http://127.0.0.1:4173
        run: npm test -- --reporter=line
      - name: Run axe Playwright gate
        env:
          SODMIN_E2E_BASE_URL: http://127.0.0.1:4173
        run: npm run test:a11y -- --reporter=line
      - name: Run keyboard gate
        env:
          SODMIN_E2E_BASE_URL: http://127.0.0.1:4173
        run: npm run test:keyboard -- --reporter=line
      - name: Run RTL gate
        env:
          SODMIN_E2E_BASE_URL: http://127.0.0.1:4173
        run: npm run test:rtl -- --reporter=line

  lighthouse:
    name: Lighthouse budget
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: wasm-build
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install npm deps
        run: npm ci
      - name: Download web artifact
        uses: actions/download-artifact@v4
        with:
          name: sodmin-web-public
          path: dist
      - name: Start static SPA
        run: |
          node scripts/serve-spa.mjs dist 4173 > serve.log 2>&1 &
          echo $! > serve.pid
          sleep 2
      - name: Run Lighthouse CI budget
        run: npm run lhci
