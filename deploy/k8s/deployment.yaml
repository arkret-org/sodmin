apiVersion: apps/v1
kind: Deployment
metadata:
  name: sodmin
  labels:
    app.kubernetes.io/name: sodmin
    app.kubernetes.io/component: admin-spa
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: sodmin
      app.kubernetes.io/component: admin-spa
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sodmin
        app.kubernetes.io/component: admin-spa
    spec:
      containers:
        - name: nginx
          # The sodmin container is a single nginx serving the Dioxus / WASM
          # SPA plus reverse-proxy locations for soland + coauth. Replace
          # with your pipeline's pinned digest.
          image: ghcr.io/contrix/sodmin:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
          env:
            - name: SOLAND_URL
              value: http://soland.internal:8008
            - name: COAUTH_URL
              value: http://coauth.internal:7080
            - name: COAUTH_PUBLIC_URL
              value: https://coauth.example.com
            # Optional opt-in browser telemetry sink (see DEPLOYMENT.md).
            # - name: SODMIN_TELEMETRY_ENDPOINT
            #   value: https://telemetry.example.com/api/v1/telemetry/error
          readinessProbe:
            httpGet:
              path: /healthz/deep
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            runAsNonRoot: true
            runAsUser: 101
            capabilities:
              drop: ["ALL"]
