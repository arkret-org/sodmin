apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: sodmin
  labels:
    app.kubernetes.io/name: sodmin
    app.kubernetes.io/component: admin-spa
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    # sodmin enforces a strict CSP at the nginx layer; do not allow the
    # ingress controller to rewrite headers.
    nginx.ingress.kubernetes.io/server-snippet: |
      more_clear_headers "Server";
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - sodmin.example.com
      secretName: sodmin-tls
  rules:
    - host: sodmin.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: sodmin
                port:
                  name: http
