# Sodmin example stack — full Cokret bring-up for nightly CI + local dogfooding.  example_pgdata:#  example_pgdata:# This stack is the minimum integrated surface that exercises sodmin against  example_pgdata:# its real upstream dependencies:  example_pgdata:#  example_pgdata:#   - postgres : shared store for coauth + soland  example_pgdata:#   - coauth   : OAuth2/OIDC + admin auth surface (distroless image)  example_pgdata:#   - soland   : Principal / actor / device coordinator (debian-slim image)  example_pgdata:#   - floria   : DID resolver + key store (debian-slim image, has curl)  example_pgdata:#   - sodmin   : Dioxus admin SPA fronted by nginx (alpine image, has wget)  example_pgdata:#  example_pgdata:# Build context layout  example_pgdata:# -------------------------------------------------  example_pgdata:# Each Rust service has sibling-repo path-deps (`../cokret-rust-sdk/...`,  example_pgdata:# `../coauth/crates/admin-types`, etc.) that the docker build sandbox  example_pgdata:# cannot follow outside the build context. Two patterns handle this:  example_pgdata:#  example_pgdata:# 1. Single-context with parent root (coauth, sodmin):  example_pgdata:#    The Dockerfile's `COPY` paths assume a context that contains BOTH  example_pgdata:#    the service source AND its sibling deps — typically the umbrella  example_pgdata:#    `cokret-dev/` directory. The compose entry sets  example_pgdata:#      build.context: ../..        (→ cokret-dev/)  example_pgdata:#      build.dockerfile: <svc>/Dockerfile  example_pgdata:#  example_pgdata:# 2. Named additional contexts (soland):  example_pgdata:#    The Dockerfile uses `COPY --from=<name>` referencing a named build  example_pgdata:#    context. Compose passes those via `additional_contexts`.  example_pgdata:#  example_pgdata:# Floria has no sibling path-deps so its context is just `../../floria`.  example_pgdata:#  example_pgdata:# Image strategy  example_pgdata:# --------------  example_pgdata:# Every container builds from its sibling repo via a build-context  example_pgdata:# computed from this file's location. The defaults assume the  example_pgdata:# cokret-dev umbrella checkout layout:  example_pgdata:#  example_pgdata:#   cokret-dev/  example_pgdata:#     cokret-rust-sdk/  example_pgdata:#     coauth/  example_pgdata:#     soland/  example_pgdata:#     floria/  example_pgdata:#     sodmin/examples/docker-compose.example-stack.yaml   <-- you are here  example_pgdata:#  example_pgdata:# Override any image with the matching `*_IMAGE` env var to pin a published  example_pgdata:# tag instead of building locally — useful for nightly when GHCR images  example_pgdata:# already exist:  example_pgdata:#  example_pgdata:#   COAUTH_IMAGE=ghcr.io/cokret/coauth:nightly \  example_pgdata:#   SOLAND_IMAGE=ghcr.io/cokret/soland:nightly \  example_pgdata:#   FLORIA_IMAGE=ghcr.io/cokret/floria:nightly \  example_pgdata:#   SODMIN_IMAGE=ghcr.io/cokret/sodmin:nightly \  example_pgdata:#       docker compose -f docker-compose.example-stack.yaml up -d  example_pgdata:#  example_pgdata:# Healthcheck strategy  example_pgdata:# --------------------  example_pgdata:# established the rule: distroless images get a CMD-form  example_pgdata:# healthcheck that calls a `<bin> healthcheck` subcommand baked into the  example_pgdata:# image; non-distroless images use whatever HTTP probe their base ships  example_pgdata:# (curl on debian-slim, wget on alpine). We do NOT use CMD-SHELL anywhere  example_pgdata:# because distroless has no shell.  example_pgdata:#  example_pgdata:#   coauth  : `coauth healthcheck` subcommand (already wired)  example_pgdata:#   soland  : debian-slim runtime ships without curl/wget. The smoke  example_pgdata:#             script probes /health externally; compose uses  example_pgdata:#             depends_on `service_started` downstream, no in-container probe.  example_pgdata:#   floria  : ships curl, probes `/ready` on its admin port.  example_pgdata:#   sodmin  : ships on nginx:alpine which has wget; probes `/healthz`.  example_pgdata:#  example_pgdata:# Port map (host:container)  example_pgdata:# -------------------------  example_pgdata:#   postgres : 55432:5432  example_pgdata:#   coauth   : 57080:7080  example_pgdata:#   soland   : 58787:8787  example_pgdata:#   floria   : 55000:5000  (admin) + 58000:8000 (data)  example_pgdata:#   sodmin   : 58200:80  example_pgdata:#  example_pgdata:# Quickstart  example_pgdata:# ----------  example_pgdata:#   ./up.sh         # build + bring up + wait for /health on each service  example_pgdata:#   ./smoke.sh      # curl every /health endpoint, expect 200  example_pgdata:#   ./down.sh       # tear down + drop volumes  example_pgdata:  example_pgdata:services:  example_pgdata:  postgres:  example_pgdata:    image: postgres:16-alpine  example_pgdata:    container_name: cokret-example-pg  example_pgdata:    environment:  example_pgdata:      POSTGRES_USER: cokret  example_pgdata:      POSTGRES_PASSWORD: cokret  example_pgdata:      POSTGRES_DB: cokret  example_pgdata:    ports:  example_pgdata:      - "55432:5432"  example_pgdata:    healthcheck:  example_pgdata:      test: ["CMD-SHELL", "pg_isready -U cokret -d cokret"]  example_pgdata:      interval: 3s  example_pgdata:      timeout: 3s  example_pgdata:      retries: 30  example_pgdata:    volumes:  example_pgdata:      - example_pgdata:/var/lib/postgresql/data  example_pgdata:    networks:  example_pgdata:      - example-stack  example_pgdata:  example_pgdata:  coauth:  example_pgdata:    image: ${COAUTH_IMAGE:-coauth:dev}  example_pgdata:    build:  example_pgdata:      # The coauth Dockerfile does `COPY ./coauth/ /app` and  example_pgdata:      # `COPY ./cokret-rust-sdk/ /cokret-rust-sdk` — both rooted at  example_pgdata:      # the build context. The context therefore must be the umbrella  example_pgdata:      # `cokret-dev/` directory (parent of both checkouts), NOT the  example_pgdata:      # `coauth/` repo itself. C36.5 hit this exact misconfig.  example_pgdata:      context: ../..  example_pgdata:      dockerfile: coauth/Dockerfile  example_pgdata:    container_name: cokret-example-coauth  example_pgdata:    depends_on:  example_pgdata:      postgres:  example_pgdata:        condition: service_healthy  example_pgdata:    # The runtime image is gcr.io/distroless/cc-debian12:nonroot — no shell,  example_pgdata:    # no wget, no curl. Use the `coauth healthcheck` CLI subcommand baked  example_pgdata:    # into the binary for liveness probing.  example_pgdata:    command: ["server", "--config", "/etc/coauth/config.yaml"]  example_pgdata:    volumes:  example_pgdata:      - ./coauth-config.yaml:/etc/coauth/config.yaml:ro  example_pgdata:    environment:  example_pgdata:      COAUTH_DATABASE__URI: postgresql://cokret:cokret@postgres:5432/cokret  example_pgdata:      COAUTH_CONFIG: /etc/coauth/config.yaml  example_pgdata:      RUST_LOG: info  example_pgdata:    ports:  example_pgdata:      - "57080:7080"  example_pgdata:    healthcheck:  example_pgdata:      test: ["CMD", "/usr/local/bin/coauth", "healthcheck", "--config", "/etc/coauth/config.yaml"]  example_pgdata:      interval: 5s  example_pgdata:      timeout: 5s  example_pgdata:      retries: 30  example_pgdata:      start_period: 20s  example_pgdata:    networks:  example_pgdata:      - example-stack  example_pgdata:  example_pgdata:  soland:  example_pgdata:    image: ${SOLAND_IMAGE:-soland:dev}  example_pgdata:    build:  example_pgdata:      # soland's Dockerfile copies its own tree from the build context  example_pgdata:      # root (`COPY . ./soland`) and its cokret-rust-sdk dependency  example_pgdata:      # via a NAMED build context (`COPY --from=cokret-rust-sdk`).  example_pgdata:      # Compose surfaces named contexts through `additional_contexts`.  example_pgdata:      context: ../../soland  example_pgdata:      dockerfile: Dockerfile  example_pgdata:      additional_contexts:  example_pgdata:        cokret-rust-sdk: ../../cokret-rust-sdk  example_pgdata:    container_name: cokret-example-soland  example_pgdata:    depends_on:  example_pgdata:      postgres:  example_pgdata:        condition: service_healthy  example_pgdata:      coauth:  example_pgdata:        condition: service_healthy  example_pgdata:    environment:  example_pgdata:      SERVERX_BIND: 0.0.0.0:8787  example_pgdata:      SERVERX_PUBLIC_BASE_URL: http://soland:8787  example_pgdata:      SERVERX_DATABASE_URL: postgresql://cokret:cokret@postgres:5432/cokret  example_pgdata:      SERVERX_COAUTH_ISSUER: http://coauth:7080/  example_pgdata:      RUST_LOG: info  example_pgdata:    ports:  example_pgdata:      - "58787:8787"  example_pgdata:    # soland's debian-slim runtime ships without curl/wget. The smoke  example_pgdata:    # script probes /health externally; compose treats this as healthy  example_pgdata:    # once the TCP listener is up. Using a depends_on `service_started`  example_pgdata:    # downstream avoids requiring an in-container probe binary.  example_pgdata:    networks:  example_pgdata:      - example-stack  example_pgdata:  example_pgdata:  floria:  example_pgdata:    image: ${FLORIA_IMAGE:-floria:dev}  example_pgdata:    build:  example_pgdata:      # floria has no sibling path-deps; its repo IS the context.  example_pgdata:      context: ../../floria  example_pgdata:      dockerfile: Dockerfile  example_pgdata:    container_name: cokret-example-floria  example_pgdata:    depends_on:  example_pgdata:      postgres:  example_pgdata:        condition: service_healthy  example_pgdata:    environment:  example_pgdata:      RUST_LOG: info  example_pgdata:    ports:  example_pgdata:      - "55000:5000"  example_pgdata:      - "58000:8000"  example_pgdata:    # floria's debian-slim runtime explicitly installs curl for the  example_pgdata:    # HEALTHCHECK declared in the Dockerfile. The compose-level probe  example_pgdata:    # below mirrors it so the stack-wide --wait honours floria readiness.  example_pgdata:    healthcheck:  example_pgdata:      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:5000/ready"]  example_pgdata:      interval: 5s  example_pgdata:      timeout: 5s  example_pgdata:      retries: 30  example_pgdata:      start_period: 15s  example_pgdata:    networks:  example_pgdata:      - example-stack  example_pgdata:  example_pgdata:  sodmin:  example_pgdata:    image: ${SODMIN_IMAGE:-sodmin:dev}  example_pgdata:    build:  example_pgdata:      # sodmin's Dockerfile does `COPY Cargo.toml Cargo.lock Dioxus.toml ./`  example_pgdata:      # then `COPY . .` from the context root — so the context must be  example_pgdata:      # the sodmin repo itself. Sodmin has path-deps on  example_pgdata:      # `../cokret-rust-sdk/...` and `../coauth/crates/admin-types`,  example_pgdata:      # but the Dockerfile resolves them via `cargo fetch` over the  example_pgdata:      # network — no in-context COPY needed for those siblings.  example_pgdata:      context: ../..  example_pgdata:      dockerfile: sodmin/Dockerfile  example_pgdata:    container_name: cokret-example-sodmin  example_pgdata:    depends_on:  example_pgdata:      coauth:  example_pgdata:        condition: service_healthy  example_pgdata:      soland:  example_pgdata:        condition: service_started  example_pgdata:    environment:  example_pgdata:      SOLAND_URL: http://soland:8787  example_pgdata:      COAUTH_URL: http://coauth:7080  example_pgdata:      COAUTH_PUBLIC_URL: http://localhost:57080  example_pgdata:      SODMIN_PORT: "80"  example_pgdata:    ports:  example_pgdata:      - "58200:80"  example_pgdata:    # sodmin runs on nginx:alpine which ships wget. The Dockerfile  example_pgdata:    # already declares the same probe — repeated here so compose --wait  example_pgdata:    # blocks on it.  example_pgdata:    healthcheck:  example_pgdata:      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/healthz"]  example_pgdata:      interval: 5s  example_pgdata:      timeout: 5s  example_pgdata:      retries: 30  example_pgdata:      start_period: 15s  example_pgdata:    networks:  example_pgdata:      - example-stack  example_pgdata:  example_pgdata:networks:  example_pgdata:  example-stack:  example_pgdata:    name: cokret-example-stack  example_pgdata:    driver: bridge  example_pgdata:  example_pgdata:volumes:  example_pgdata:  example_pgdata:  example_pgdata: