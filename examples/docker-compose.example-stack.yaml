# Sodmin example stack — full Contrix bring-up for nightly CI + local dogfooding.
#
# This stack is the minimum integrated surface that exercises sodmin against
# its real upstream dependencies:
#
#   - postgres : shared store for coauth + soland
#   - coauth   : OAuth2/OIDC + admin auth surface (distroless image)
#   - soland   : Principal / actor / device coordinator (debian-slim image)
#   - floria   : DID resolver + key store (debian-slim image, has curl)
#   - sodmin   : Dioxus admin SPA fronted by nginx (alpine image, has wget)
#
# Build context layout (lessons from C36.5 + C37.3)
# -------------------------------------------------
# Each Rust service has sibling-repo path-deps (`../contrix-rust-sdk/...`,
# `../coauth/crates/admin-types`, etc.) that the docker build sandbox
# cannot follow outside the build context. Two patterns handle this:
#
# 1. Single-context with parent root (coauth, sodmin):
#    The Dockerfile's `COPY` paths assume a context that contains BOTH
#    the service source AND its sibling deps — typically the umbrella
#    `contrix-dev/` directory. The compose entry sets
#      build.context: ../..        (→ contrix-dev/)
#      build.dockerfile: <svc>/Dockerfile
#
# 2. Named additional contexts (soland):
#    The Dockerfile uses `COPY --from=<name>` referencing a named build
#    context. Compose passes those via `additional_contexts`.
#
# Floria has no sibling path-deps so its context is just `../../floria`.
#
# Image strategy
# --------------
# Every container builds from its sibling repo via a build-context
# computed from this file's location. The defaults assume the
# contrix-dev umbrella checkout layout:
#
#   contrix-dev/
#     contrix-rust-sdk/
#     coauth/
#     soland/
#     floria/
#     sodmin/examples/docker-compose.example-stack.yaml   <-- you are here
#
# Override any image with the matching `*_IMAGE` env var to pin a published
# tag instead of building locally — useful for nightly when GHCR images
# already exist:
#
#   COAUTH_IMAGE=ghcr.io/contrix/coauth:nightly \
#   SOLAND_IMAGE=ghcr.io/contrix/soland:nightly \
#   FLORIA_IMAGE=ghcr.io/contrix/floria:nightly \
#   SODMIN_IMAGE=ghcr.io/contrix/sodmin:nightly \
#       docker compose -f docker-compose.example-stack.yaml up -d
#
# Healthcheck strategy
# --------------------
# C33.6 (coauth) established the rule: distroless images get a CMD-form
# healthcheck that calls a `<bin> healthcheck` subcommand baked into the
# image; non-distroless images use whatever HTTP probe their base ships
# (curl on debian-slim, wget on alpine). We do NOT use CMD-SHELL anywhere
# because distroless has no shell.
#
#   coauth  : `coauth healthcheck` subcommand (already wired)
#   soland  : debian-slim runtime ships without curl/wget. The smoke
#             script probes /health externally; compose uses
#             depends_on `service_started` downstream, no in-container probe.
#   floria  : ships curl, probes `/ready` on its admin port.
#   sodmin  : ships on nginx:alpine which has wget; probes `/healthz`.
#
# Port map (host:container)
# -------------------------
#   postgres : 55432:5432
#   coauth   : 57080:7080
#   soland   : 58787:8787
#   floria   : 55000:5000  (admin) + 58000:8000 (data)
#   sodmin   : 58200:80
#
# Quickstart
# ----------
#   ./up.sh         # build + bring up + wait for /health on each service
#   ./smoke.sh      # curl every /health endpoint, expect 200
#   ./down.sh       # tear down + drop volumes

services:
  postgres:
    image: postgres:16-alpine
    container_name: contrix-example-pg
    environment:
      POSTGRES_USER: contrix
      POSTGRES_PASSWORD: contrix
      POSTGRES_DB: contrix
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U contrix -d contrix"]
      interval: 3s
      timeout: 3s
      retries: 30
    volumes:
      - example_pgdata:/var/lib/postgresql/data
    networks:
      - example-stack

  coauth:
    image: ${COAUTH_IMAGE:-coauth:dev}
    build:
      # The coauth Dockerfile does `COPY ./coauth/ /app` and
      # `COPY ./contrix-rust-sdk/ /contrix-rust-sdk` — both rooted at
      # the build context. The context therefore must be the umbrella
      # `contrix-dev/` directory (parent of both checkouts), NOT the
      # `coauth/` repo itself. C36.5 hit this exact misconfig.
      context: ../..
      dockerfile: coauth/Dockerfile
    container_name: contrix-example-coauth
    depends_on:
      postgres:
        condition: service_healthy
    # The runtime image is gcr.io/distroless/cc-debian12:nonroot — no shell,
    # no wget, no curl. Use the `coauth healthcheck` CLI subcommand baked
    # into the binary (C33.6 work landed this) for liveness probing.
    command: ["server", "--config", "/etc/coauth/config.yaml"]
    volumes:
      - ./coauth-config.yaml:/etc/coauth/config.yaml:ro
    environment:
      COAUTH_DATABASE__URI: postgresql://contrix:contrix@postgres:5432/contrix
      COAUTH_CONFIG: /etc/coauth/config.yaml
      RUST_LOG: info
    ports:
      - "57080:7080"
    healthcheck:
      test: ["CMD", "/usr/local/bin/coauth", "healthcheck", "--config", "/etc/coauth/config.yaml"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    networks:
      - example-stack

  soland:
    image: ${SOLAND_IMAGE:-soland:dev}
    build:
      # soland's Dockerfile copies its own tree from the build context
      # root (`COPY . ./soland`) and its contrix-rust-sdk dependency
      # via a NAMED build context (`COPY --from=contrix-rust-sdk`).
      # Compose surfaces named contexts through `additional_contexts`.
      context: ../../soland
      dockerfile: Dockerfile
      additional_contexts:
        contrix-rust-sdk: ../../contrix-rust-sdk
    container_name: contrix-example-soland
    depends_on:
      postgres:
        condition: service_healthy
      coauth:
        condition: service_healthy
    environment:
      SERVERX_BIND: 0.0.0.0:8787
      SERVERX_PUBLIC_BASE_URL: http://soland:8787
      SERVERX_DATABASE_URL: postgresql://contrix:contrix@postgres:5432/contrix
      SERVERX_COAUTH_ISSUER: http://coauth:7080/
      RUST_LOG: info
    ports:
      - "58787:8787"
    # soland's debian-slim runtime ships without curl/wget. The smoke
    # script probes /health externally; compose treats this as healthy
    # once the TCP listener is up. Using a depends_on `service_started`
    # downstream avoids requiring an in-container probe binary.
    networks:
      - example-stack

  floria:
    image: ${FLORIA_IMAGE:-floria:dev}
    build:
      # floria has no sibling path-deps; its repo IS the context.
      context: ../../floria
      dockerfile: Dockerfile
    container_name: contrix-example-floria
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      RUST_LOG: info
    ports:
      - "55000:5000"
      - "58000:8000"
    # floria's debian-slim runtime explicitly installs curl for the
    # HEALTHCHECK declared in the Dockerfile. The compose-level probe
    # below mirrors it so the stack-wide --wait honours floria readiness.
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:5000/ready"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 15s
    networks:
      - example-stack

  sodmin:
    image: ${SODMIN_IMAGE:-sodmin:dev}
    build:
      # sodmin's Dockerfile does `COPY Cargo.toml Cargo.lock Dioxus.toml ./`
      # then `COPY . .` from the context root — so the context must be
      # the sodmin repo itself. Sodmin has path-deps on
      # `../contrix-rust-sdk/...` and `../coauth/crates/admin-types`,
      # but the Dockerfile resolves them via `cargo fetch` over the
      # network — no in-context COPY needed for those siblings.
      context: ../..
      dockerfile: sodmin/Dockerfile
    container_name: contrix-example-sodmin
    depends_on:
      coauth:
        condition: service_healthy
      soland:
        condition: service_started
    environment:
      SOLAND_URL: http://soland:8787
      COAUTH_URL: http://coauth:7080
      COAUTH_PUBLIC_URL: http://localhost:57080
      SODMIN_PORT: "80"
    ports:
      - "58200:80"
    # sodmin runs on nginx:alpine which ships wget. The Dockerfile
    # already declares the same probe — repeated here so compose --wait
    # blocks on it.
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/healthz"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 15s
    networks:
      - example-stack

networks:
  example-stack:
    name: contrix-example-stack
    driver: bridge

volumes:
  example_pgdata:
