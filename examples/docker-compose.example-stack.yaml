# Real development services for the nightly health and admin SPA smoke gate.
# Coauth and Soland have separate databases. Account Authority authentication
# additionally requires the TLS and Station trust-edge deployment configuration.
name: arkret-sodmin-example
services:
  postgres:
    image: postgres:16-alpine
    container_name: arkret-example-pg
    environment:
      POSTGRES_USER: arkret
      POSTGRES_PASSWORD: arkret
      POSTGRES_DB: arkret
    ports: ["127.0.0.1:55432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U arkret -d arkret"]
      interval: 3s
      timeout: 3s
      retries: 30
    volumes: [example_pgdata:/var/lib/postgresql/data]
    networks: [example-stack]

  coauth:
    image: ${COAUTH_IMAGE:-coauth:dev}
    build:
      context: ../..
      dockerfile: coauth/Dockerfile
    container_name: arkret-example-coauth
    depends_on:
      postgres:
        condition: service_healthy
    command: ["server", "--config", "/etc/coauth/config.yaml"]
    volumes:
      - ./coauth-config.yaml:/etc/coauth/config.yaml:ro
      - example_coauth_data:/var/lib/coauth
      - example_coauth_master_key:/run/secrets:ro
    environment:
      COAUTH_DATABASE__URI: postgresql://arkret:arkret@postgres:5432/coauth
      COAUTH_CONFIG: /etc/coauth/config.yaml
      RUST_LOG: info
      RUST_BACKTRACE: "1"
    ports: ["127.0.0.1:57080:7080"]
    healthcheck:
      test: ["CMD", "/usr/local/bin/coauth", "healthcheck", "--config", "/etc/coauth/config.yaml"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    networks: [example-stack]

  # Initial key provisioning runs separately; ordinary servers only reload.
  coauth-provision:
    image: ${COAUTH_IMAGE:-coauth:dev}
    profiles: [setup]
    container_name: arkret-example-coauth-provision
    depends_on:
      postgres:
        condition: service_healthy
    command: ["server", "--config", "/etc/coauth/config.yaml", "--first-provisioning", "--no-worker"]
    volumes:
      - ./coauth-config.yaml:/etc/coauth/config.yaml:ro
      - example_coauth_data:/var/lib/coauth
      - example_coauth_master_key:/run/secrets:ro
    environment:
      RUST_LOG: info
      RUST_BACKTRACE: "1"
    healthcheck:
      test: ["CMD", "/usr/local/bin/coauth", "healthcheck", "--config", "/etc/coauth/config.yaml"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    networks: [example-stack]

  # One-shot setup outside server startup. Validate existing keys, never rotate.
  soland-keystore-init:
    image: ${SOLAND_IMAGE:-soland:dev}
    profiles: [setup]
    user: "0:0"
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        install -d -m 0700 -o 10001 -g 10001 /secrets /var/lib/soland/keystore /var/lib/soland/identity-bundle
        /usr/local/bin/soland-keystore-keygen --output /secrets/master-key --if-missing
        chown 10001:10001 /secrets/master-key
        chmod 0400 /secrets/master-key
        install -d -m 0700 -o 65532 -g 65532 /coauth-secrets /var/lib/coauth /var/lib/coauth/data /var/lib/coauth/data/media
        /usr/local/bin/soland-keystore-keygen --output /coauth-secrets/master-key --if-missing
        chown 65532:65532 /coauth-secrets/master-key
        chmod 0400 /coauth-secrets/master-key
    volumes:
      - example_soland_master_key:/secrets
      - example_soland_data:/var/lib/soland
      - example_coauth_master_key:/coauth-secrets
      - example_coauth_data:/var/lib/coauth
    network_mode: none

  soland:
    image: ${SOLAND_IMAGE:-soland:dev}
    build:
      context: ../../soland
      dockerfile: Dockerfile
      additional_contexts:
        arkret-rust-sdk: ../../arkret-rust-sdk
        arkret-spec: ../../arkret-spec
        floria: ../../floria
    container_name: arkret-example-soland
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SOLAND_BIND: 0.0.0.0:8787
      SOLAND_HEALTHCHECK_URL: https://127.0.0.1:8787/health
      SOLAND_PUBLIC_BASE_URL: https://soland.example:8787
      SOLAND_TLS_CERT_PATH: /run/example-tls/soland.crt
      SOLAND_TLS_KEY_PATH: /run/example-tls/soland.key
      SSL_CERT_FILE: /run/example-tls/ca.crt
      DATABASE_URL: postgresql://arkret:arkret@postgres:5432/soland
      SOLAND_TRUST_DOMAIN: ak:trust_domain:soland.example
      SOLAND_DEVELOPMENT_MODE: "true"
      SOLAND_KEYSTORE_BACKEND: encrypted_file
      SOLAND_KEYSTORE_PATH: /var/lib/soland/keystore/soland.v1
      SOLAND_KEYSTORE_MASTER_KEY_FILE: /run/secrets/master-key
      SOLAND_SERVICE_IDENTITY_BUNDLE_DIR: /var/lib/soland/identity-bundle
      RUST_LOG: info
    volumes:
      - example_soland_data:/var/lib/soland
      - example_soland_master_key:/run/secrets:ro
      - ./.local/tls/ca.crt:/run/example-tls/ca.crt:ro
      - ./.local/tls/soland.crt:/run/example-tls/soland.crt:ro
      - ./.local/tls/soland.key:/run/example-tls/soland.key:ro
    ports: ["127.0.0.1:58787:8787"]
    healthcheck:
      test: ["CMD", "/usr/local/bin/soland", "healthcheck"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    networks:
      example-stack:
        aliases: [soland.example]

  floria:
    image: ${FLORIA_IMAGE:-floria:dev}
    build:
      context: ../../floria
      dockerfile: Dockerfile
      additional_contexts:
        arkret-rust-sdk: ../../arkret-rust-sdk
    container_name: arkret-example-floria
    # Explicit --config enables the documented FLORIA_* environment overrides.
    command: ["/usr/local/bin/floria", "--config", "/app/floria.kdl"]
    volumes: ["./floria-config.kdl:/app/floria.kdl:ro"]
    environment:
      RUST_LOG: info
      FLORIA_HTTP__BIND_ADDRESSES: '["0.0.0.0"]'
    ports: ["127.0.0.1:55000:5000"]
    healthcheck:
      test: ["CMD", "/usr/local/bin/floria-healthcheck"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 15s
    networks: [example-stack]

  sodmin:
    image: ${SODMIN_IMAGE:-sodmin:dev}
    build:
      context: ../..
      dockerfile: sodmin/Dockerfile
    container_name: arkret-example-sodmin
    depends_on:
      coauth:
        condition: service_healthy
      soland:
        condition: service_healthy
    environment:
      SOLAND_URL: https://soland.example:8787
      SODMIN_UPSTREAM_CA_FILE: /run/example-tls/ca.crt
      COAUTH_URL: http://coauth:7080
      COAUTH_PUBLIC_URL: http://localhost:57080
      SODMIN_PORT: "80"
    volumes: ["./.local/tls/ca.crt:/run/example-tls/ca.crt:ro"]
    ports: ["127.0.0.1:58200:80"]
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/healthz"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 15s
    networks: [example-stack]

networks:
  example-stack:
    driver: bridge

volumes:
  example_pgdata:
  example_soland_data:
  example_soland_master_key:
  example_coauth_data:
  example_coauth_master_key:
