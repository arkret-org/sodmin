[application]
name = "sodmin"
default_platform = "web"

[web.app]
title = "Cokret Admin"

# S5 token hardening: production deployments must set the matching
# Content-Security-Policy header at the web server or CDN tier. The app
# also installs a CSP meta tag at bootstrap as defense in depth.
[web.resource]
style = []

# dx 0.7.5 requires the dev subsection explicitly; without it
# `dx build --release` errors with "missing field `dev`".
[web.resource.dev]
style = []

[web.https]
enabled = false
