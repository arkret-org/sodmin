# cargo-deny configuration
# Documentation: https://embarkstudios.github.io/cargo-deny/

[graph]
all-features = false
no-default-features = false

[advisories]
version = 2
ignore = [
    # RSA Marvin Attack applies to PKCS#1 v1.5 decryption. sodmin is a WASM
    # admin client and reaches rsa only through shared signing dependencies; it
    # does not perform RSA private-key decryption.
    # Owner: security maintainers. Last reviewed: 2026-07-14.
    # Re-review by: 2026-10-14, or when a patched rsa release lands.
    "RUSTSEC-2023-0071",
]

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "CC0-1.0",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "MPL-2.0",
    "OpenSSL",
]
confidence-threshold = 0.93

[bans]
multiple-versions = "warn"
wildcards = "warn"
deny = []
skip = []
skip-tree = []

[sources]
unknown-registry = "warn"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# arkret-org/dioxus point-to-graceful fork (see Cargo.toml [patch.crates-io]).
allow-git = [
    "https://github.com/arkret-org/dioxus",
    "https://github.com/arkret-org/dioxus-components",
    # Shared Arkret frontend component crate, consumed straight from its
    # private repository instead of a sibling path dependency.
    "https://github.com/arkret-org/yoface",
]
